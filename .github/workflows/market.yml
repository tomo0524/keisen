name: market-data
on:
  schedule:
    - cron: "40 21 * * 0-4"
    - cron: "50 6 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_market.py market.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git diff --cached --quiet || (git commit -m "update market.json" && git push)
